name: Deploy archive forward to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Retired 2026-11-16: the archive now forwards to https://penny-one-eta.vercel.app.
      # Every path serves retired/ (404.html catches the rest); /pieces/N goes to the grid at #N.
      # To bring the Quartz archive back, revert this commit.
      - uses: actions/checkout@v7
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: retired

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
